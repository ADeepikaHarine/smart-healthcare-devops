name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: node-version: 18
      - name: Run backend tests
        working-directory: services/backend
        run: |
          npm ci
          npm test
      - name: Run frontend tests
        working-directory: services/frontend
        run: |
          npm ci
          npm test -- --watchAll=false

  build-and-push:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build & push backend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} services/backend
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - name: Build & push frontend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} services/frontend
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
      - name: Set image tags output
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_DATA }}" > kubeconfig && export KUBECONFIG=$PWD/kubeconfig
      - name: Deploy to cluster
        run: |
          kubectl set image deployment/backend backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} --namespace default || true
          kubectl set image deployment/frontend frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} --namespace default || true
